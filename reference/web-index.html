<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102D27"><title>MİHRA</title>
<style>
:root{--bg:#102D27;--card:#1B4338;--card2:#285544;--gold:#E7C98B;--cream:#F8F6EF;--paper:#DCE7DE;--mint:#C8D9CF;--ink:#233D32;--soft:#C9D9CD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 110px;display:flex;flex-direction:column;gap:13px}
button{font:inherit;cursor:pointer;border:0}
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:11px}
.panel.dark{background:var(--card);color:var(--cream)}
h3{margin:0 0 4px;font-size:19px}.gold{color:var(--gold);font-weight:700;font-size:18px}
.gl{color:var(--gold);font-weight:700;font-size:28px}.big{color:var(--gold);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.mint{color:var(--mint)}.sm{font-size:12px}.c{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.opts,.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.opts{margin:6px 0}
.pill{border-radius:9px;padding:8px 11px;border:1px solid #5E806E;background:var(--card2);color:var(--mint);font-size:12px;font-weight:600}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn{background:var(--gold);color:var(--bg);border-radius:11px;padding:12px 17px;min-width:86px;font-weight:700;margin-top:4px}
.btn.out{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.panel:not(.dark) .btn.out{color:var(--card);border-color:var(--card)}
.header{display:flex;justify-content:space-between;align-items:center}
.brand{color:var(--gold);font-size:27px;font-weight:800;letter-spacing:3px}.brandbig{color:var(--gold);font-size:38px;font-weight:800;letter-spacing:5px}
.icon{background:var(--card);color:var(--gold);border-radius:14px;padding:10px 14px;font-size:15px}
.welcome{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.logo{width:112px;height:112px;border-radius:30px;background:var(--card);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--gold);margin-bottom:14px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:.5px solid #94A89C;background:none;color:inherit;width:100%;text-align:left}
.toggle.hl{background:var(--soft);padding:11px 8px;border-radius:8px}
.inner{background:var(--soft);color:var(--ink);padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:9px;margin:8px 0}
.inner p,.panel p{margin:0}
.ar{font-size:26px;line-height:1.9;text-align:center;color:var(--card)}.dark .ar,.zt .ar{color:var(--gold)}
.zt{background:var(--card2);border-radius:15px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.counter{width:200px;height:200px;border-radius:50%;border:4px solid var(--gold);background:var(--card2);margin:16px auto;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
.counter b{color:var(--gold);font-size:56px}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}.bar i{display:block;height:8px;background:var(--gold)}
input,textarea{width:100%;border:1px solid #AFC3B5;background:#E9F1EB;border-radius:9px;padding:11px;color:var(--ink);font:inherit;min-height:46px;margin-top:4px}
a{color:#1A7458}.dark a{color:var(--gold)}
.ad{background:#24463B;padding:13px;border-radius:9px;text-align:center;font-size:12px;border:1px dashed #5E806E}
.compass{width:230px;height:230px;border:2px solid var(--gold);border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;position:relative;margin:10px auto}
.compass span{position:absolute;color:var(--gold)}.compass span.s{bottom:8px;color:var(--mint)}
#arrow{transition:transform .15s}
.juz{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.juz button{height:42px;border-radius:9px;background:var(--card2);color:var(--cream);font-weight:700}.juz button.on{background:var(--gold);color:var(--bg)}
.sure{border-bottom:.5px solid #C4D1C7;padding:8px 0}.sure>button{background:none;color:inherit;text-align:left;width:100%;padding:0}
.ayah{direction:rtl;text-align:right;color:var(--card);line-height:2}
.plist button{display:block;width:100%;text-align:left;background:var(--card2);color:var(--cream);padding:11px;border-radius:9px;margin-top:5px;font-size:15px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rboxes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;width:100%}.rbox{background:var(--card2);border-radius:18px;padding:12px 4px;text-align:center;font-size:13px}.rbox b{display:block;color:var(--gold);font-size:30px;line-height:1.2}
.wbtn{background:var(--paper);color:var(--ink);border-radius:999px;padding:15px;font-weight:700;width:100%;font-size:16px}
.gcard{background:var(--paper);color:var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.chip{background:#C6D6CA;color:var(--ink);border-radius:14px;padding:10px 4px;text-align:center;font-size:14px;line-height:1.35}.chip.on{background:var(--card);color:var(--cream)}
.seg{display:flex;gap:6px}.seg button{padding:10px 18px;border-radius:999px;background:transparent;color:#7c8c83;font-weight:600;font-size:16px}.seg button.on{background:#C6D6CA;color:var(--ink)}
.gstep{background:#C9D9CD;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}.gstep h3{font-size:24px;margin:0}
.oku{background:#E9F1EB;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}.oku>button{background:none;color:var(--card);font-weight:700;font-size:17px;text-align:left;width:100%;padding:0;display:flex;justify-content:space-between}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gbtns .btn{margin:0;border-radius:999px}
.rf{background:#C6D6CA;color:var(--card);border-radius:12px;width:42px;height:42px;font-size:18px;flex:none}.dark .rf{background:var(--card2);color:var(--gold)}
.gcard .btn.out{color:var(--card);border-color:var(--card)}
.opt{display:flex;align-items:center;gap:12px;background:none;color:var(--cream);padding:9px 0;width:100%;text-align:left;font-size:17px}
.ck,.rd{width:28px;height:28px;border-radius:50%;border:2px solid #5E806E;flex:none;display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:800;position:relative}
.ck.on{background:var(--gold);border-color:var(--gold)}.rd.on{border-color:var(--gold)}.rd.on::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr}.sl{color:var(--mint);font-size:15px;margin-top:8px}
select{width:100%;background:var(--card2);color:var(--cream);border:1px solid var(--gold);border-radius:999px;padding:13px 16px;font:inherit;font-size:16px}
.kb{text-align:center;padding:12px;border-radius:12px;background:var(--card2);color:var(--mint);font-weight:600}.kb.ok{background:#1f6b45;color:#fff}
.elist{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card2);border-radius:14px;padding:4px 6px}
.er{display:flex;align-items:center;gap:10px;width:100%;background:none;color:var(--cream);padding:11px 6px;border-bottom:.5px solid #3f6a58;text-align:left;border-radius:8px}
.er.on{background:var(--card);outline:1px solid var(--gold)}.en{color:var(--gold);width:26px;font-size:13px;flex:none}.et{flex:1;line-height:1.35}.et small{color:var(--mint);font-size:12.5px;margin-left:6px}.ea{font-size:24px;color:var(--gold);direction:rtl;flex:none;line-height:1.5}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);opacity:.6;visibility:hidden;transition:transform .42s cubic-bezier(.22,.8,.28,1),opacity .35s ease,visibility 0s linear .42s;box-shadow:-18px 0 40px rgba(0,0,0,.45)}
#sheet.open{transform:none;opacity:1;visibility:visible;transition:transform .42s cubic-bezier(.22,.8,.28,1),opacity .35s ease,visibility 0s}
.shin{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:13px}
.wz{background:var(--card2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}.wz h3{margin:0;font-size:22px}.wz a.btn{display:block;text-align:center;text-decoration:none}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(231,201,139,.9)}60%{box-shadow:0 0 44px 20px rgba(231,201,139,.55)}100%{box-shadow:0 0 0 0 rgba(231,201,139,0)}}
.counter.glow{animation:glow 1.1s ease-out 4;border-color:#fff3c9}
.gin{display:flex;gap:8px;align-items:center}.gin input{margin:0;flex:1}.gin .btn{margin:0}
#reader{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);visibility:hidden;transition:transform .42s cubic-bezier(.22,.8,.28,1),visibility 0s linear .42s}
#reader.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.22,.8,.28,1),visibility 0s}
.rbar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;max-width:560px;margin:auto;border-bottom:1px solid #264c40}
.ay{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ay .ayah{color:#14352c;line-height:2.1}.meal{margin:0;color:#35564a}
.bd{width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sr{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--ink);padding:10px 4px;border-bottom:.5px solid #AFC3B5;text-align:left}.sr small{color:#4a6a5b}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid #5E806E;flex:none}.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.hint{text-align:center;color:var(--mint);font-size:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #355C4D;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs div{max-width:560px;margin:auto;display:flex;justify-content:space-around;padding:8px 0}
#tabs button{background:none;color:var(--mint);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 8px}#tabs button i{font-style:normal;font-size:21px}
#tabs button.on{color:var(--gold)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:528px;margin:auto;background:var(--gold);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;display:none;z-index:40}
</style></head><body>
<div id="app"></div><div id="sheet"></div><div id="reader"></div>
<nav id="tabs"><div></div></nav><div id="toast"></div>
<script>
const D={"countries": {"Türkiye": ["İstanbul", "Ankara", "İzmir", "Bursa", "Konya", "Antalya", "Kahramanmaraş", "Malatya", "Trabzon", "Gaziantep"], "Almanya": ["Berlin", "Hamburg", "Münih", "Köln"], "Fransa": ["Paris", "Lyon"], "Hollanda": ["Amsterdam", "Rotterdam"], "Belçika": ["Brüksel", "Anvers"], "Birleşik Krallık": ["Londra", "Manchester"], "ABD": ["New York", "Chicago"], "Suudi Arabistan": ["Mekke", "Medine"]}, "zikirs": [{"name": "Sübhanallah", "arabic": "سُبْحَانَ اللّٰهِ", "meaning": "Allah’ı eksikliklerden uzak tutarım."}, {"name": "Elhamdülillah", "arabic": "الْحَمْدُ لِلّٰهِ", "meaning": "Hamd Allah’a mahsustur."}, {"name": "Allahu Ekber", "arabic": "اللّٰهُ أَكْبَرُ", "meaning": "Allah en büyüktür."}, {"name": "Estağfirullah", "arabic": "أَسْتَغْفِرُ اللّٰهَ", "meaning": "Allah’tan bağışlanma dilerim."}, {"name": "Lâ ilâhe illallah", "arabic": "لَا إِلٰهَ إِلَّا اللّٰهُ", "meaning": "Allah’tan başka ilah yoktur."}, {"name": "Salavat", "arabic": "اللّٰهُمَّ صَلِّ عَلَى مُحَمَّدٍ", "meaning": "Allah’ım, Muhammed’e salât eyle."}], "duas": [{"name": "Hz. Yunus’un Duası", "cat": "Peygamber", "ar": "لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "pron": "Lâ ilâhe illâ ente sübhâneke innî küntü mine’z-zâlimîn.", "meaning": "Senden başka ilah yoktur. Seni eksikliklerden uzak tutarım. Ben kendine zulmedenlerden oldum. (Enbiyâ 21:87)"}, {"name": "Hz. Musa’nın Duası", "cat": "Peygamber", "ar": "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي", "pron": "Rabbi’şrah lî sadrî ve yessir lî emrî.", "meaning": "Rabbim, gönlüme ferahlık ver ve işimi kolaylaştır. (Tâhâ 20:25-26)"}, {"name": "İstiğfar", "cat": "Tövbe", "ar": "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "pron": "Estağfirullâhe ve etûbü ileyh.", "meaning": "Allah’tan bağışlanma diler ve O’na tövbe ederim."}, {"name": "Yemek Öncesi", "cat": "Günlük", "ar": "بِسْمِ اللَّهِ", "pron": "Bismillâh.", "meaning": "Allah’ın adıyla."}, {"name": "Rükû Tesbihi", "cat": "Namaz", "ar": "سُبْحَانَ رَبِّيَ الْعَظِيمِ", "pron": "Sübhâne rabbiye’l-azîm.", "meaning": "Yüce Rabbimi eksikliklerden uzak tutarım."}, {"name": "Secde Tesbihi", "cat": "Namaz", "ar": "سُبْحَانَ رَبِّيَ الْأَعْلَى", "pron": "Sübhâne rabbiye’l-a’lâ.", "meaning": "En yüce Rabbimi eksikliklerden uzak tutarım."}], "lessons": [{"name": "Abdest Nasıl Alınır?", "category": "İbadet", "intro": "Abdest, belirli organların yıkanması ve mesh edilmesiyle yapılan ibadet temizliğidir.", "steps": [{"title": "Farzlar", "body": "Hanefî mezhebine göre yüzü yıkamak, kolları dirseklerle birlikte yıkamak, başın en az dörtte birini mesh etmek, ayakları topuklarla birlikte yıkamak abdestin farzlarıdır.", "note": "Mezheplere göre bazı ayrıntılar farklı olabilir."}, {"title": "Eller, ağız ve burun", "body": "Niyet ve besmeleden sonra eller yıkanır; ağıza ve buruna üçer defa su verilir.", "note": "Niyet Hanefî mezhebinde sünnettir."}, {"title": "Yüz ve kollar", "body": "Yüzün tamamı yıkanır. Önce sağ sonra sol kol dirseklerle birlikte yıkanır.", "note": "Yıkanması gereken yerlerde kuru alan bırakılmaz."}, {"title": "Mesh ve ayaklar", "body": "Baş mesh edilir, kulaklar mesh edilir. Ayaklar topuklarla birlikte yıkanır.", "note": "Parmak aralarına su ulaşmalıdır."}]}, {"name": "Gusül Abdesti", "category": "İbadet", "intro": "Gusül bütün bedenin dinen gerekli şekilde yıkanmasıdır.", "steps": [{"title": "Guslün farzları", "body": "Hanefî mezhebine göre ağza su vermek, buruna su vermek ve bütün bedeni yıkamak farzdır.", "note": "Kuru yer kalmamasına dikkat edilir."}, {"title": "Hazırlık", "body": "Niyet edilir, besmele çekilir, eller ve kirli bölgeler temizlenir.", "note": "Niyet ve besmele sünnetlerdendir."}, {"title": "Bütün beden", "body": "Ağıza ve buruna su verildikten sonra baş ve bütün vücut yıkanır.", "note": "Suyun deriyle temasını engelleyen maddeler giderilmelidir."}]}, {"name": "Teyemmüm", "category": "İbadet", "intro": "Su bulunmadığında veya geçerli mazeretle kullanılamadığında yapılan temizlik.", "steps": [{"title": "Şartlar", "body": "Suyun bulunmaması veya kullanımının mümkün olmaması gibi geçerli mazeretler değerlendirilir.", "note": "Su varken sırf kolaylık için yapılmaz."}, {"title": "Niyet ve yüz", "body": "Niyet edilir. Eller uygun temiz yüzeye vurularak yüz mesh edilir.", "note": "Niyet gereklidir."}, {"title": "Kollar", "body": "Eller tekrar yüzeye vurularak kollar dirseklerle birlikte mesh edilir.", "note": "Hanefî uygulaması esas alınmıştır."}]}, {"name": "Oruç ve Ramazan", "category": "İbadet", "intro": "Oruç, imsak ile gün batımı arasında belirli davranışlardan ibadet niyetiyle uzak durmaktır.", "steps": [{"title": "Niyet", "body": "Oruç için niyet edilir; sahur yapmak sünnettir.", "note": "Niyetin zamanı oruç türüne göre değişebilir."}, {"title": "Orucu korumak", "body": "Yeme, içme ve orucu bozan davranışlardan uzak durulur.", "note": "Tıbbi durumlar için güvenilir fetvaya başvurulur."}, {"title": "İftar", "body": "Güneş battıktan sonra oruç açılır; dua ve paylaşma önemlidir.", "note": "İhtiyaç sahipleri gözetilir."}]}, {"name": "Sabah Namazı", "category": "Namaz", "intro": "İki rekât sünnet ve iki rekât farz.", "steps": [{"title": "Hazırlık", "body": "Abdest, vakit, kıble, örtünme ve niyet kontrol edilir.", "note": "Namazın şartları yerine getirilir."}, {"title": "Sünnet", "body": "İki rekât sünnet kılınır, son oturuş ve selamla tamamlanır.", "note": "Sünnet için ayrı niyet edilir."}, {"title": "Farz", "body": "İki rekât farz tek başına veya cemaatle kılınır.", "note": "İmama uyma hükümleri mezhebe göre değişebilir."}]}, {"name": "Öğle Namazı", "category": "Namaz", "intro": "Dört ilk sünnet, dört farz, iki son sünnet.", "steps": [{"title": "İlk sünnet", "body": "Dört rekât ilk sünnete niyet edilir.", "note": "Oturuş sırası öğrenilir."}, {"title": "Farz", "body": "Dört rekât farza niyet edilir.", "note": "Cemaatle kılınırken imam takip edilir."}, {"title": "Son sünnet", "body": "İki rekât son sünnet kılınır.", "note": "Her bölüm için niyet ayrıdır."}]}, {"name": "İkindi Namazı", "category": "Namaz", "intro": "Dört sünnet ve dört farz.", "steps": [{"title": "Sünnet", "body": "Dört rekât gayrimüekked sünnet kılınabilir.", "note": "İlk oturuştaki uygulama farklarını öğren."}, {"title": "Farz", "body": "Dört rekât farz kılınır.", "note": "Kıraat ve oturuş sırası önemlidir."}]}, {"name": "Akşam Namazı", "category": "Namaz", "intro": "Üç farz ve iki sünnet.", "steps": [{"title": "Farz", "body": "Üç rekât farz kılınır; ikinci rekâttan sonra ilk oturuş vardır.", "note": "Üçüncü rekâtın kıraati farklıdır."}, {"title": "Sünnet", "body": "İki rekât sünnet kılınır.", "note": "Son oturuş ve selamla tamamlanır."}]}, {"name": "Yatsı ve Vitir", "category": "Namaz", "intro": "Dört ilk sünnet, dört farz, iki son sünnet ve üç vitir.", "steps": [{"title": "Yatsı", "body": "Sünnet ve farz bölümleri sırasıyla kılınır.", "note": "Her bölümün niyeti ayrıdır."}, {"title": "Vitir", "body": "Hanefî mezhebine göre vitir üç rekât ve vaciptir.", "note": "Diğer mezheplerde farklı uygulamalar bulunur."}, {"title": "Kunut", "body": "Üçüncü rekâtta kıraatten sonra tekbir alınarak kunut duaları okunur.", "note": "Kunut duaları ayrıca öğrenilir."}]}, {"name": "Cenaze Namazı", "category": "Namaz", "intro": "Rükû ve secdesi bulunmayan, ayakta kılınan namaz.", "steps": [{"title": "İlk tekbir", "body": "Niyet edilir, tekbirden sonra Sübhâneke okunur.", "note": "Farz-ı kifâyedir."}, {"title": "İkinci tekbir", "body": "Salavatlar okunur.", "note": "Rükû ve secde yapılmaz."}, {"title": "Üçüncü tekbir", "body": "Cenaze için dua edilir.", "note": "Duanın tam metni ayrıca doğrulanmalıdır."}, {"title": "Dördüncü tekbir", "body": "Tekbirden sonra selam verilir.", "note": "Hanefî uygulamasının özetidir."}]}, {"name": "Bayram Namazı", "category": "Namaz", "intro": "Cemaatle kılınan iki rekâtlık namaz.", "steps": [{"title": "İlk rekât", "body": "Hanefî uygulamasında üç ilave tekbir alınır.", "note": "İmam takip edilir."}, {"title": "İkinci rekât", "body": "Kıraatten sonra üç ilave tekbir alınır.", "note": "Namazdan sonra hutbe dinlenir."}]}, {"name": "Namaz Duaları", "category": "Dualar", "intro": "Namazda okunan temel dualar.", "steps": [{"title": "Sübhâneke", "body": "Başlangıç duasının anlamı ve okunuşu öğrenilir.", "note": "Arapça metin ayrı doğrulanmış içerik olarak eklenecek."}, {"title": "Ettehiyyâtü", "body": "Oturuş duasının yeri öğrenilir.", "note": "İlk ve son oturuş ayrımına dikkat edilir."}, {"title": "Salavat ve Rabbenâ", "body": "Salli, Bârik ve Rabbenâ duaları öğrenilir.", "note": "Vitirde kunut duaları ayrıca çalışılır."}]}, {"name": "Kısa Sureler", "category": "Dualar", "intro": "Namazda sık okunan sureleri tanı.", "steps": [{"title": "Fâtiha", "body": "Fâtiha suresinin anlamı ve namazdaki yeri.", "note": "Tam ayet metinleri doğrulanmış veri kaynağıyla eklenecek."}, {"title": "İhlâs", "body": "Allah’ın birliğini anlatır.", "note": "Tevhid konusu."}, {"title": "Felak ve Nâs", "body": "Allah’a sığınmayı konu edinir.", "note": "Surelerin tam metni kaynak kontrolüyle eklenecek."}]}, {"name": "Tövbe ve İstiğfar", "category": "Maneviyat", "intro": "Hatalardan dönme ve bağışlanma dileme.", "steps": [{"title": "Pişmanlık", "body": "Yanlış davranış için içtenlikle pişmanlık duyulur.", "note": "Samimiyet önemlidir."}, {"title": "Terk ve kararlılık", "body": "Yanlış bırakılır ve tekrarlanmaması için karar verilir.", "note": "Davranış değişikliği gerekir."}, {"title": "Kul hakkı", "body": "Başkasının hakkı ihlal edilmişse iade veya helalleşme gözetilir.", "note": "Kul hakkı özel sorumluluktur."}]}, {"name": "Peygamberimizin Hayatı", "category": "Siyer", "intro": "Hz. Muhammed’in hayatından temel dönemler.", "steps": [{"title": "Çocukluk", "body": "Mekke’de doğumu, ailesi ve gençlik dönemi.", "note": "Siyer kronolojisi takip edilir."}, {"title": "İlk vahiy", "body": "Hira’da ilk vahiy ve tebliğin başlangıcı.", "note": "Mekke dönemi yaklaşık 13 yıldır."}, {"title": "Hicret", "body": "Medine’ye hicret ve toplumun kuruluşu.", "note": "İslam tarihinde dönüm noktasıdır."}, {"title": "Veda Hutbesi", "body": "Adalet, sorumluluk ve insan hakları vurguları.", "note": "Kaynaklar üzerinden ayrıntılı incelenmelidir."}]}, {"name": "İmanın Şartları", "category": "İnanç", "intro": "İslam inancının temel esasları.", "steps": [{"title": "Allah’a iman", "body": "Allah’ın birliği ve sıfatları.", "note": "Tevhid esastır."}, {"title": "Meleklere ve kitaplara iman", "body": "Meleklerin ve ilahi kitapların dinî yeri.", "note": "Gayba iman açıklanır."}, {"title": "Peygamberler", "body": "Peygamberlerin rehberliği.", "note": "Örnek ahlak önemlidir."}, {"title": "Ahiret ve kader", "body": "Sorumluluk, ahiret ve kader kavramları.", "note": "Güvenilir kaynaklarla ayrıntılandırılır."}]}, {"name": "Abdesti Bozan Şeyler", "category": "İbadet", "intro": "Abdesti bozan hâlleri bilmek, namazın geçerliliği için önemlidir (Hanefî mezhebine göre).", "steps": [{"title": "Abdesti bozanlar", "body": "Ön ve arka yoldan idrar, dışkı, yel veya başka bir şeyin çıkması; vücudun herhangi bir yerinden kan, irin gibi bir sıvının akıp yıkanması gereken yere ulaşması; ağız dolusu kusmak; yatarak veya bir şeye yaslanarak uyumak; bayılmak, aklî dengeyi kaybetmek; namaz kılarken sesli (kahkaha ile) gülmek abdesti bozar.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Abdesti bozmayanlar", "body": "Kanın akmayacak kadar az çıkması, tükürük ve balgam, ayakta veya oturarak kısa uyuklamak, eşe dokunmak (Hanefî mezhebine göre) abdesti bozmaz.", "note": "Mezhepler arasında farklılık olabilir."}, {"title": "Şüphe hâli", "body": "Abdestli olduğundan emin olan kişi, abdestinin bozulduğundan şüphe ederse abdestli sayılır. Abdestsiz olduğundan emin olan kişi, abdest aldığından şüphe ederse abdestsiz sayılır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Namazın Şartları ve Farzları", "category": "İbadet", "intro": "Namaz, dışındaki şartları (altı şart) ve içindeki farzları (altı farz) ile geçerli olur.", "steps": [{"title": "Namazın dışındaki şartlar", "body": "1) Hadesten taharet (abdest, gerekiyorsa gusül), 2) Necâsetten taharet (beden, elbise ve namaz yerinin temizliği), 3) Setr-i avret (avret yerlerinin örtülmesi), 4) İstikbâl-i kıble (kıbleye yönelmek), 5) Vakit, 6) Niyet.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Namazın içindeki farzlar", "body": "1) İftitah tekbiri (namaza “Allâhü ekber” diyerek başlamak), 2) Kıyam (ayakta durmak), 3) Kıraat (Kur’an’dan okumak), 4) Rükû, 5) Secde, 6) Ka‘de-i âhire (son oturuş).", "note": "Farzlardan biri terk edilirse namaz geçerli olmaz."}, {"title": "Vacipler", "body": "Fâtiha’yı okumak, Fâtiha’dan sonra bir sure veya üç kısa âyet okumak, vitir namazında kunut dualarını okumak, bayram namazlarında ilave tekbirleri getirmek namazın vaciplerindendir. Unutularak terk edilirse sehiv secdesi gerekir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Zekât ve Nisap", "category": "İbadet", "intro": "Zekât, nisap miktarı mala sahip olan müslümanın, malının belirli bir bölümünü hak sahiplerine vermesidir.", "steps": [{"title": "Kimlere farzdır?", "body": "Akıllı, ergenlik çağına ermiş müslüman olmak; temel ihtiyaçlarından ve borcundan arta kalan malın nisap miktarına ulaşması ve bu malın üzerinden bir yıl (kameri) geçmesi gerekir.", "note": "Kaynak: Diyanet İlmihali, İman ve İbadetler."}, {"title": "Nisap miktarları", "body": "Altın: 80,18 gram. Gümüş: 561 gram. Para ve ticaret malı: altın veya gümüş nisabı değerinde olması. Hayvanlarda: koyun ve keçide 40, sığırda 30, devede 5 adet.", "note": "Kaynak: Diyanet İlmihali. Güncel altın fiyatı için Diyanet’in zekât hesaplama sayfasına bak."}, {"title": "Oran ve hesap", "body": "Altın, gümüş, para ve ticaret malında zekât oranı kırkta bir (yüzde 2,5)’dir. Örnek: nisap miktarını aşan 100.000 TL’lik birikim için zekât 2.500 TL olur.", "note": "Nisap altın değerine göre güncellenir."}, {"title": "Kimlere verilir?", "body": "Tevbe suresi 60. âyette sayılan sekiz sınıf: fakirler, düşkünler, zekât toplayan görevliler, kalpleri İslam’a ısındırılacaklar, köleliği ve esareti kaldırmak için, borçlular, Allah yolunda olanlar, yolda kalmışlar.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Kimlere verilmez?", "body": "Anne-baba, dede-nine gibi usûle; çocuk, torun gibi fürûa; eşe ve nisap miktarı mala sahip olanlara zekât verilmez.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Fitre ve Kurban", "category": "İbadet", "intro": "Sadaka-i fıtır ve kurban, Ramazan ve Kurban Bayramı’nda yerine getirilen iki mali ibadettir.", "steps": [{"title": "Fitre", "body": "Ramazan Bayramı’ndan önce, temel ihtiyaçlarından fazla nisap miktarı mala sahip her müslümana vaciptir. Bayram namazından önce verilmesi uygundur. Miktarını Diyanet her yıl ilan eder.", "note": "Güncel miktar için Diyanet duyurusuna bak."}, {"title": "Kurban", "body": "Hanefî mezhebine göre mukim ve nisap miktarı mala sahip kimseye vaciptir. Kurban Bayramı’nın birinci günü bayram namazından sonra başlar, üçüncü günün akşamına kadar kesilebilir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Yaş ve hisse şartları", "body": "Koyun ve keçi bir yaşını, sığır iki yaşını, deve beş yaşını doldurmuş olmalıdır. Koyun ve keçi bir kişi, sığır ve deve en çok yedi kişi adına kesilebilir. Kurbanlık hayvan ayıpsız olmalıdır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Etin dağıtımı", "body": "Etin üçe bölünüp bir kısmının yoksullara verilmesi, bir kısmının akraba-komşuya dağıtılması ve bir kısmının evde kullanılması müstehaptır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Hac ve Umre", "category": "İbadet", "intro": "Hac, gücü yeten müslümana ömründe bir kez farz olan ibadettir (Âl-i İmrân 3:97).", "steps": [{"title": "Hacın şartları", "body": "Müslüman, akıllı, ergenlik çağına ermiş ve hür olmak; yol güvenliği; yolculuğa ve ailenin geçimine yetecek maddi güce ve sağlığa sahip olmak. Kadının yanında kocası veya bir mahremi bulunması gerekir (Hanefî mezhebine göre).", "note": "Ayrıntılar için Diyanet Hac ve Umre rehberine bak."}, {"title": "Hacın farzları", "body": "Hanefî mezhebine göre hacın farzları: ihrama girmek, Arafat’ta vakfe, ziyaret tavafı.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Hacın vacipleri", "body": "Müzdelife’de vakfe, şeytan taşlama (cemrelere taş atma), Safa-Merve arasında sa‘y, kurban (temettü ve kıran haccında), traş olmak veya saçı kısaltmak, veda tavafı.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Umre", "body": "Yılın her zamanı yapılabilen, haccın küçüğü sayılan ibadettir: ihram, tavaf ve sa‘y yapılır, traş olunur veya saç kısaltılır. Hanefî mezhebinde umre sünnettir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Orucu Bozan ve Bozmayan Şeyler", "category": "İbadet", "intro": "Oruç, imsak vaktinden akşam ezanına kadar niyetle yeme, içme ve cinsel ilişkiden uzak durmaktır (Bakara 2:187).", "steps": [{"title": "Orucu bozanlar", "body": "Kasten yemek veya içmek, kasten ağız dolusu kusmak, cinsel ilişki, sigara içmek ve ağızdan alınan ilaçlar orucu bozar.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Kaza ve kefaret", "body": "Ramazan orucunu özürsüz ve kasten yeme-içme veya cinsel ilişkiyle bozan kişi, orucu kaza eder ve ayrıca kefaret öder: Hanefî mezhebine göre ardı ardına 60 gün oruç tutar. Buna gücü yetmezse 60 yoksulu doyurur.", "note": "Diğer bozma hâllerinde yalnızca kaza gerekir."}, {"title": "Orucu bozmayanlar", "body": "Unutarak yemek veya içmek, kendiliğinden kusmak, gayri ihtiyari boğaza toz, duman, sinek kaçması, ağıza kasıt olmadan su kaçması, diş fırçalarken yutmamak orucu bozmaz. Rüyada ihtilam olmak da orucu bozmaz.", "note": "Tereddüt hâllerinde güvenilir bir din görevlisine danış."}, {"title": "Mazeretler", "body": "Hasta ve yolcu, orucu tutmayıp sonradan kaza edebilir. İyileşme ihtimali bulunmayan hastalar ve yaşlılar fidye verir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Cuma Namazı", "category": "Namaz", "intro": "Cuma namazı, gücü yeten her erkeğe farz-ı ayndır (Cuma 62:9).", "steps": [{"title": "Önemi", "body": "“Ey iman edenler! Cuma günü namaz için çağrıldığınız zaman Allah’ı anmaya koşun, alışverişi bırakın.” (Cuma 62:9) Cuma gününün müslümanlar için özel bir değeri vardır.", "note": "Âyet: Cuma 62:9 (anlam)."}, {"title": "Şartları", "body": "Mukim olmak, sağlıklı olmak, erkek, akıllı ve ergenlik çağına ermiş olmak, cemaatle kılınmak ve hutbe okunmasıdır. Yolcular, hastalar, kadınlar için farz değildir ancak katılırlarsa Cuma namazı yerine geçer.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Kılınışı", "body": "İlk sünnet 4 rekât, ardından hutbe (dinlenir, konuşulmaz), imamla 2 rekât farz, ardından 4 rekât son sünnet kılınır.", "note": "Bazı kaynaklarda ek olarak 2 rekât vakit sünneti de zikredilir."}]}, {"name": "Teravih Namazı", "category": "Namaz", "intro": "Teravih, Ramazan gecelerine özgü bir sünnettir.", "steps": [{"title": "Hükmü ve vakti", "body": "Ramazan ayında yatsı namazından sonra kılınan sünnet-i müekkede bir namazdır. Vitirden önce kılınır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Rekât sayısı", "body": "Hanefî mezhebine göre 20 rekâttır ve ikişer rekât olarak kılınır. Cemaatle kılınması sünnet-i kifayedir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Vitirle ilişkisi", "body": "Yatsı farzı, yatsı son sünneti, teravih ve ardından vitir namazı kılınır. Ramazan’da vitir genellikle imamla cemaatle kılınır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Yolcu (Kasr) Namazı", "category": "Namaz", "intro": "Seferî (yolcu) olan kişi, dört rekâtlı farz namazları iki rekât olarak kılar.", "steps": [{"title": "Sefer mesafesi", "body": "Yerleşim yerinin dışına yaklaşık 90 km ve daha fazla bir yolculuğa çıkan kişi seferî sayılır. Şehirden çıkınca kasra başlar.", "note": "Diyanet, yaklaşık 90 km’yi esas alır."}, {"title": "Neler kısalır?", "body": "Öğle, ikindi ve yatsı farzları 2 rekât kılınır. Sabah, akşam ve vitir aynen kılınır. Sünnetler seferde kılınabilir; yolculukta acele edilirse terk edilebilir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Ne zaman mukim olunur?", "body": "Gidilen yerde 15 gün veya daha fazla kalmaya niyet eden kişi mukim sayılır ve tam kılar. 15 günden az kalmaya niyet edenler kasr yapmaya devam eder.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Hasta Namazı", "category": "Namaz", "intro": "Hasta, gücü yettiği şekilde namazını kılar; namaz hiçbir hâlde terk edilmez.", "steps": [{"title": "Ayakta kılamayan", "body": "Ayakta duramayan veya durması hastalığını artıran kişi oturarak kılar. Rükû ve secdeyi başıyla işaret ederek yapar; secde için başını rükûdan biraz daha fazla eğer.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Oturamayan", "body": "Oturamayan kişi yatarak, başıyla işaret ederek kılar. Mümkünse ayakları kıbleye doğru uzatılır veya kıbleye dönük yan yatılır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Güç kaybı", "body": "Başıyla işaret edemeyecek kadar rahatsız olanlar için ayrıntılar fıkhî hükümlere bağlıdır; böyle durumlarda din görevlisine danışılmalıdır.", "note": "Kendi durumun için mutlaka din görevlisine danış."}]}, {"name": "Sehiv Secdesi", "category": "Namaz", "intro": "Namazda bir vacibi unutarak terk eden veya geciktiren kişiye sehiv secdesi gerekir.", "steps": [{"title": "Ne zaman gerekir?", "body": "Vacibi unutarak terk etmek veya geciktirmek (örneğin Fâtiha’dan sonra sure okumayı unutmak, ilk oturuşu yapmadan kalkmak) sehiv secdesini gerektirir. Farz terk edilirse namaz bozulur, sehiv secdesi yetmez.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Nasıl yapılır?", "body": "Son oturuşta Ettehiyyâtü okunduktan sonra yalnızca sağa selam verilir. Sonra “Allâhü ekber” diyerek iki secde yapılır, oturulup Ettehiyyâtü, salavatlar ve dualar tekrar okunur, selam verilir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Kaza Namazı", "category": "Namaz", "intro": "Vaktinde kılınamayan farz ve vacip namazlar sonradan kaza edilir.", "steps": [{"title": "Kaza ne demektir?", "body": "Vakti çıkmış bir farz veya vacip namazın sonradan kılınmasıdır. Uyuyup kalma, unutma gibi mazeretler günahı kaldırır; ancak namazı kaza etmek yine gerekir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Nasıl kılınır?", "body": "Kaza niyetiyle, hangi vaktin namazı olduğu belirtilerek kılınır (örn. “Kaza edeceğim ilk sabah farzına niyet ettim”). Vitir namazı da kaza edilir. Kaza, dört rekâtlık farzlar için dört rekât olarak kılınır.", "note": "Kaza sayısı için bir din görevlisine danışmak yararlıdır."}, {"title": "Düzen", "body": "Kaza borcu olan kişi kaza borcunu ödemeye bir an önce başlamalıdır. Sünnet namazlar kaza edilmez (sabah sünneti belirli şartlarla istisnadır).", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Namazı Bozan Şeyler", "category": "Namaz", "intro": "Namazdaki bazı davranışlar namazı bozar ve namazın baştan kılınmasını gerektirir.", "steps": [{"title": "Namazı bozanlar", "body": "Namazda konuşmak, yemek veya içmek, sesli gülmek, abdesti bozacak bir durumun meydana gelmesi, kıbleden göğüsle dönmek, ameli kesir (namaza yakışmayan çok hareket) yapmak, avret yerinin açık kalması, farzlardan birini terk etmek.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Namazı bozmayanlar", "body": "Namaz esnasında kendiliğinden gelen öksürük, aksırık veya esneme (elle kapatmak sünnettir), kısa bir hareket namazı bozmaz.", "note": "Ayrıntıda din görevlisine danış."}]}, {"name": "Günlük Dualar", "category": "Dualar", "intro": "Günlük hayatta sıkça okunan kısa dualar. Okunuşları ve anlamları aşağıdadır.", "steps": [{"title": "Yemekte", "body": "Yemeğe başlarken: “Bismillâhi ve alâ bereketillâh.” Yedikten sonra: “Elhamdülillâhillezî et‘amenâ ve sekânâ ve cealenâ müslimîn.” Anlamı: “Bizi yedirip içiren ve müslüman kılan Allah’a hamdolsun.”", "note": "Kaynak: Ebû Dâvûd, Tirmizî, hadis rivayeti."}, {"title": "Uyurken ve kalkarken", "body": "Uyurken: “Allâhümme bismike emûtü ve ehyâ.” (Allah’ım! Senin adınla ölür ve dirilirim.) Uyanınca: “Elhamdülillâhillezî ahyânâ ba‘de mâ emâtenâ ve ileyhin-nüşûr.” (Bizi öldürdükten sonra dirilten Allah’a hamdolsun; dönüş O’nadır.)", "note": "Kaynak: Buhârî."}, {"title": "Yolculukta", "body": "“Sübhânellezî sahhara lenâ hâzâ ve mâ künnâ lehû mukrinîn. Ve innâ ilâ rabbinâ le munkalibûn.” Anlamı: “Bunu bizim hizmetimize veren Allah, her türlü eksiklikten uzaktır. Biz buna güç yetiremezdik. Şüphesiz biz Rabbimize döneceğiz.”", "note": "Kaynak: Zuhruf 43:13-14."}, {"title": "Eve girerken ve çıkarken", "body": "Girerken ve çıkarken “Bismillâh” demek, ardından Allah’a tevekkül etmek sünnettir. Çıkarken: “Bismillâhi tevekkeltü alallâh, lâ havle ve lâ kuvvete illâ billâh.”", "note": "Kaynak: Ebû Dâvûd, Tirmizî."}]}, {"name": "Âyetel Kürsî", "category": "Dualar", "intro": "Âyetel Kürsî, Bakara suresinin 255. âyetidir ve Kur’an’ın büyük âyetlerinden biridir.", "steps": [{"title": "Okunuşu", "body": "Allâhü lâ ilâhe illâ hüvel hayyül kayyûm. Lâ te’huzühû sinetüv ve lâ nevm. Lehû mâ fîs-semâvâti ve mâ fîl-ard. Men zellezî yeşfeu ındehû illâ bi-iznih. Ya‘lemü mâ beyne eydîhim ve mâ halfehüm. Ve lâ yühîtûne bi-şey’im min ılmihî illâ bimâ şâe. Vesia kürsiyyühüs-semâvâti vel-ard. Ve lâ yeûdühû hıfzuhümâ ve hüvel aliyyül azîm.", "note": "Kaynak: Bakara 2:255."}, {"title": "Anlamı", "body": "Allah’tan başka ilah yoktur; O diridir, her şeyi ayakta tutandır. Uyuklama ve uyku O’nu tutmaz. Göklerde ve yerde ne varsa O’nundur. İzni olmadan katında kim şefaat edebilir? Önlerindekini ve arkalarındakini bilir. İlminden, kendisinin dilediği kadarından başka hiçbir şeyi kavrayamazlar. Kürsüsü gökleri ve yeri kuşatmıştır. Onları korumak O’na ağır gelmez. O yücedir, büyüktür.", "note": "Anlam kısaltılmış mealdir."}, {"title": "Ne zaman okunur?", "body": "Hz. Peygamber’in farz namazlardan sonra ve yatmadan önce okunmasını tavsiye ettiği rivayet edilir.", "note": "Kaynak: Buhârî, Nesâî rivayetleri."}]}, {"name": "Dua Adabı", "category": "Maneviyat", "intro": "Allah, kullarının duasına yakındır (Bakara 2:186).", "steps": [{"title": "Duaya karşılık", "body": "“Kullarım sana beni sorarsa, şüphesiz ben yakınım. Bana dua edenin duasına karşılık veririm.” (Bakara 2:186) “Bana dua edin, size karşılık vereyim.” (Mü’min 40:60)", "note": "Âyetler: anlam olarak verilmiştir."}, {"title": "Duanın adabı", "body": "Allah’a hamd ve Hz. Peygamber’e salavatla başlamak, kıbleye dönmek, ellerini açmak, kalbi hazır ve samimi olmak, duayı ısrarla ve ümitle yapmak, haram yoldan kazanılan nimetlerden uzak durmak dua adabındandır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Duadan sonra", "body": "Dua sonunda tekrar salavat getirilir ve “Âmîn” denilir. Duanın kabulü Allah’ın hikmetine bağlıdır; ya istenen verilir ya da daha hayırlısı verilir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Sabır ve Şükür", "category": "Maneviyat", "intro": "Sabır ve şükür, müminin hayat boyu iki temel tutumudur.", "steps": [{"title": "Sabır", "body": "“Ey iman edenler! Sabır ve namazla yardım dileyin. Şüphesiz Allah sabredenlerle beraberdir.” (Bakara 2:153) Sabır; sıkıntıda şikâyetten, ibadette bıkkınlıktan, günahta da nefsin peşinden gitmekten kaçınmaktır.", "note": "Âyet: Bakara 2:153 (anlam)."}, {"title": "Şükür", "body": "“Eğer şükrederseniz, elbette size nimetimi artırırım.” (İbrâhîm 14:7) Şükür; nimeti verenin Allah olduğunu bilmek, dil ile hamd etmek ve nimeti doğru yolda kullanmaktır.", "note": "Âyet: İbrâhîm 14:7 (anlam)."}]}, {"name": "Anne-Baba Hakkı ve Güzel Ahlak", "category": "Maneviyat", "intro": "İslam, anne-babaya iyilik etmeyi ve güzel ahlakı çok önemser.", "steps": [{"title": "Anne-babaya iyilik", "body": "“Rabbin, yalnız kendisine kulluk etmenizi ve anne babaya iyilik etmenizi emretti. Onlardan biri veya her ikisi yanında yaşlılığa erirse onlara ‘öf’ bile deme.” (İsrâ 17:23)", "note": "Âyet: İsrâ 17:23 (anlam)."}, {"title": "Güzel ahlak", "body": "Hz. Peygamber: “Ben ancak güzel ahlâkı tamamlamak için gönderildim.” Doğruluk, emanete riayet, komşu hakkı ve söze sadakat güzel ahlakın temelleridir.", "note": "Hadis: Muvatta, Ahmed b. Hanbel."}]}, {"name": "Hicret ve Medine Dönemi", "category": "Siyer", "intro": "Hicret, İslam tarihinin dönüm noktasıdır.", "steps": [{"title": "Hicret (622)", "body": "Mekke’de müşriklerin baskısı artınca Hz. Peygamber ve Müslümanlar Medine’ye hicret etti. Hicret, hicrî takvimin başlangıcıdır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Medine’de kuruluş", "body": "Mescid-i Nebevî inşa edildi, muhacir ve ensar arasında kardeşlik kuruldu, Medine’de farklı toplulukları kapsayan bir düzen (Medine Vesikası) oluşturuldu.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Önemli olaylar", "body": "Bedir (624), Uhud (625), Hendek (627), Hudeybiye Antlaşması (628), Mekke’nin fethi (630), Veda Haccı (632).", "note": "Tarihler miladî takvime göredir."}, {"title": "Vefat", "body": "Hz. Peygamber hicrî 11 (miladî 632) yılında Medine’de vefat etti.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Dört Halife", "category": "Siyer", "intro": "Hz. Peygamber’den sonra İslam toplumunu yöneten dört halife “Hulefâ-yi Râşidîn” diye anılır.", "steps": [{"title": "Sıralama", "body": "1) Hz. Ebû Bekir (632–634), 2) Hz. Ömer (634–644), 3) Hz. Osman (644–656), 4) Hz. Ali (656–661).", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Kısaca", "body": "Ebû Bekir: Kur’an’ın toplanması ve irtidat olayları; Ömer: fetihler ve idarî düzen; Osman: Mushafın çoğaltılması; Ali: iç karışıklıklar dönemi.", "note": "Özetler kısadır; ayrıntı için siyer kitaplarına bak."}]}, {"name": "İslam’ın Şartları", "category": "İnanç", "intro": "“İslam beş esas üzerine kurulmuştur.” (Buhârî, Müslim)", "steps": [{"title": "Beş şart", "body": "1) Kelime-i şehadet getirmek, 2) Namaz kılmak, 3) Zekât vermek, 4) Ramazan orucunu tutmak, 5) Gücü yetenin haccetmesi.", "note": "Kaynak: Buhârî, Müslim."}, {"title": "Kelime-i şehadet", "body": "“Eşhedü en lâ ilâhe illallâh ve eşhedü enne Muhammeden abdühû ve resûlüh.” Anlamı: Allah’tan başka ilah olmadığına ve Muhammed’in O’nun kulu ve elçisi olduğuna şahitlik ederim.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}]}, {"name": "Melekler, Kitaplar ve Peygamberler", "category": "İnanç", "intro": "İmanın şartlarından üçü: meleklere, kitaplara ve peygamberlere iman.", "steps": [{"title": "Melekler", "body": "Melekler, Allah’ın nurdan yarattığı, emre itaat eden varlıklardır. Dört büyük melek: Cebrâil (vahiy), Mîkâil (rızık ve yağmur), İsrâfîl (sûra üfürmek), Azrâil (ruhları almak).", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Kitaplar", "body": "Dört büyük kitap: Tevrat (Hz. Musa), Zebur (Hz. Davud), İncil (Hz. İsa), Kur’an-ı Kerim (Hz. Muhammed). Bunun yanında sahifeler de indirilmiştir.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Peygamberler", "body": "İlk peygamber Hz. Âdem, son peygamber Hz. Muhammed’dir. “Muhammed… Allah’ın elçisi ve peygamberlerin sonuncusudur.” (Ahzâb 33:40) Ulü’l-azm peygamberler: Nuh, İbrahim, Musa, İsa ve Muhammed.", "note": "Âyet: Ahzâb 33:40 (anlam)."}]}, {"name": "Ahiret ve Kader", "category": "İnanç", "intro": "Ahirete ve kadere iman, imanın son iki şartıdır.", "steps": [{"title": "Ahiret", "body": "Ölümden sonra kabir hayatı, kıyamet, yeniden diriliş, hesap, mizan, sırat ve cennet-cehennem ahiret inancının unsurlarıdır.", "note": "Kaynak: Diyanet İşleri Başkanlığı, İlmihal"}, {"title": "Kader", "body": "Kader, Allah’ın her şeyi ezelî ilmiyle bilmesi ve takdir etmesidir. Bu, insanın iradesini ve sorumluluğunu ortadan kaldırmaz; insan yaptıklarından sorumludur.", "note": "Kaynak: Diyanet İlmihali, İman ve İbadetler."}]}], "sources": {"vakit": "https://namazvakitleri.diyanet.gov.tr/", "kuran": "https://kuran.diyanet.gov.tr/", "namaz": "https://namaz.diyanet.gov.tr/"}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ascii=s=>s.replace(/İ/g,'I').replace(/ı/g,'i').replace(/ç/g,'c').replace(/Ç/g,'C').replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ü/g,'u').replace(/Ü/g,'U').replace(/ö/g,'o').replace(/Ö/g,'O');
const pad=n=>String(n).padStart(2,'0');
const EN={Türkiye:'Turkey',Almanya:'Germany',Fransa:'France',Hollanda:'Netherlands',Belçika:'Belgium','Birleşik Krallık':'United Kingdom',ABD:'United States','Suudi Arabistan':'Saudi Arabia'};

const ABOUT={"Hakkımızda": "<p><b>MİHRA<\/b>; namaz vakitleri, kıble, zikir, Kur’an ve temel dinî bilgileri tek yerde, sade bir arayüzle sunan ücretsiz bir İslamî yaşam uygulamasıdır.<\/p><p>Giriş yapmak, hesap açmak veya üyelik oluşturmak gerekmez.<\/p><p>Amacımız, günlük ibadet hayatında kullanıcıya pratik, güvenilir kaynaklara dayanan ve dikkat dağıtmayan bir yardımcı olmaktır.<\/p>", "Gizlilik Politikası": "<p><b>Son güncelleme: 11 Ekim 2026<\/b><\/p><p><b>Hesap ve kişisel bilgiler.<\/b> MİHRA hesap, giriş veya üyelik gerektirmez; ad, e-posta, telefon gibi kimlik bilgilerinizi toplamayız.<\/p><p><b>Cihazınızda saklananlar.<\/b> Seçtiğiniz şehir ve ülke, izin verirseniz konumunuz, bildirim ve duvar kağıdı ayarları, zikir sayaçları ve hedefleri, kaydettiğiniz dersler ve Kur’an okuma yeriniz yalnızca cihazınızda saklanır; bizim sunucularımıza gönderilmez. Uygulamayı sildiğinizde veya Ayarlar → Hakkında → “Tüm verilerimi sil” ile bu veriler silinir.<\/p><p><b>Konum.<\/b> Konum izni verirseniz, namaz vakitlerini ve kıble yönünü hesaplamak için kullanılır. İzni dilediğiniz zaman cihaz ayarlarından kapatabilir, şehrinizi elle seçebilirsiniz.<\/p><p><b>Üçüncü taraf hizmetler.<\/b> Uygulama; namaz vakitleri için Aladhan (konum koordinatları veya şehir adı), konumdan şehir adı bulmak için BigDataCloud (koordinatlar), şehir araması için Open-Meteo (yazdığınız arama metni) ve Kur’an metni/meali için AlQuran Cloud hizmetlerine istek gönderir. Bu hizmetler, internet bağlantısının doğası gereği IP adresinizi görebilir; kendi gizlilik politikaları geçerlidir. Biz bu bilgileri sizinle eşleştirmeyiz.<\/p><p><b>Bildirimler.<\/b> Namaz ve günlük söz bildirimleri cihazınızda yerel olarak oluşturulur ve izin verirseniz gösterilir.<\/p><p><b>İzleme ve reklam.<\/b> Şu anda analitik veya reklam takip aracı kullanılmamaktadır. İleride eklenirse bu politika güncellenir ve gerekli izinler istenir.<\/p><p><b>Çocuklar.<\/b> Uygulama çocuklardan bilerek kişisel veri toplamaz.<\/p><p><b>Haklarınız.<\/b> Verileriniz cihazınızda tutulduğundan silme ve değiştirme kontrolü sizdedir. 6698 sayılı KVKK kapsamındaki talepleriniz için “İletişim” bölümündeki adrese yazabilirsiniz.<\/p><p><b>Değişiklikler.<\/b> Bu politika güncellenebilir; güncel sürüm uygulamada ve web adresinde yer alır.<\/p>", "Kullanım Koşulları": "<p><b>Son güncelleme: 11 Ekim 2026<\/b><\/p><p><b>Bilgilendirme amacı.<\/b> MİHRA’daki namaz vakitleri hesaplama yöntemine ve konuma göre değişebilir; kesin vakit için resmî kaynak olan Diyanet İşleri Başkanlığı’nın takvimi esas alınmalıdır.<\/p><p><b>Dinî içerik.<\/b> Dinî bilgiler, Hanefî mezhebine ve Diyanet İlmihali’ne göre hazırlanan genel bilgilendirmelerdir; fetva yerine geçmez. Kişisel durumunuz için bir din görevlisine danışınız.<\/p><p><b>Garanti.<\/b> Uygulama “olduğu gibi” sunulur; kesintisiz veya hatasız çalışacağına dair garanti verilmez. Üçüncü taraf verilerin doğruluğundan ilgili hizmet sağlayıcılar sorumludur.<\/p><p><b>Sorumluluk.<\/b> Uygulamanın kullanımından doğabilecek dolaylı zararlardan, yasaların izin verdiği ölçüde sorumluluk kabul edilmez.<\/p><p><b>Fikrî haklar.<\/b> Kur’an metni ve meal dahil içerikler ilgili hak sahiplerine aittir; uygulamadaki tasarım ve yazılım izinsiz kopyalanamaz.<\/p><p><b>Değişiklik.<\/b> Bu koşullar güncellenebilir; uygulamayı kullanmaya devam etmeniz güncel koşulları kabul ettiğiniz anlamına gelir.<\/p>", "Dinî İçerik Bildirimi": "<p>Derslerdeki bilgiler Hanefî mezhebi esas alınarak ve Diyanet İlmihali’nden yararlanılarak hazırlanmıştır; mezhepler arasında ayrıntı farkları olabilir.<\/p><p>Ayet, hadis ve dualar kısa anlam olarak verilir; ilgili kaynaklarla birlikte okunmalıdır.<\/p><p>Hata veya eksik fark ederseniz “İletişim” bölümünden bize bildirebilirsiniz.<\/p>", "Veri Kaynakları ve Atıflar": "<p><b>Namaz vakitleri:<\/b> Aladhan Prayer Times API (Türkiye için Diyanet hesaplama yöntemi).<\/p><p><b>Kur’an metni ve meal:<\/b> AlQuran Cloud API; Arapça metin Tanzil Uthmani, Türkçe meal Diyanet İşleri Başkanlığı.<\/p><p><b>Şehir arama:<\/b> Open-Meteo Geocoding API (GeoNames verisi, CC BY 4.0).<\/p><p><b>Konumdan şehir adı:<\/b> BigDataCloud Client-Side Reverse Geocoding.<\/p><p><b>Dinî bilgiler:<\/b> Diyanet İşleri Başkanlığı İlmihali ve resmî yayınları.<\/p><p>Bu veri sağlayıcılarının hizmet koşulları ve lisansları geçerlidir; yayın öncesi kullanım izinleri ayrıca doğrulanacaktır.<\/p>"};
