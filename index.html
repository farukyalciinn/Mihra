<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102D27"><title>MİHRA</title>
<style>
:root{--bg:#102D27;--card:#1B4338;--card2:#285544;--gold:#E7C98B;--cream:#F8F6EF;--mint:#C8D9CF;--ink:#233D32;--soft:#E8EEE7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 110px;display:flex;flex-direction:column;gap:13px}
button{font:inherit;cursor:pointer;border:0}
.panel{background:var(--cream);color:var(--ink);border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:11px}
.panel.dark{background:var(--card);color:var(--cream)}
h3{margin:0 0 4px;font-size:19px}.gold{color:var(--gold);font-weight:700;font-size:18px}
.gl{color:var(--gold);font-weight:700;font-size:28px}.big{color:var(--gold);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.mint{color:var(--mint)}.sm{font-size:12px}.c{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.opts,.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.opts{margin:6px 0}
.pill{border-radius:9px;padding:8px 11px;border:1px solid #5E806E;background:var(--card2);color:var(--mint);font-size:12px;font-weight:600}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn{background:var(--gold);color:var(--bg);border-radius:11px;padding:12px 17px;min-width:86px;font-weight:700;margin-top:4px}
.btn.out{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.panel:not(.dark) .btn.out{color:var(--card);border-color:var(--card)}
.header{display:flex;justify-content:space-between;align-items:center}
.brand{color:var(--gold);font-size:27px;font-weight:800;letter-spacing:3px}.brandbig{color:var(--gold);font-size:38px;font-weight:800;letter-spacing:5px}
.icon{background:var(--card);color:var(--gold);border-radius:14px;padding:10px 14px;font-size:15px}
.welcome{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.logo{width:112px;height:112px;border-radius:30px;background:var(--card);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--gold);margin-bottom:14px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:.5px solid #94A89C;background:none;color:inherit;width:100%;text-align:left}
.toggle.hl{background:var(--soft);padding:11px 8px;border-radius:8px}
.inner{background:var(--soft);color:var(--ink);padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:9px;margin:8px 0}
.inner p,.panel p{margin:0}
.ar{font-size:26px;line-height:1.9;text-align:center;color:var(--card)}.dark .ar,.zt .ar{color:var(--gold)}
.zt{background:var(--card2);border-radius:15px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.counter{width:200px;height:200px;border-radius:50%;border:4px solid var(--gold);background:var(--card2);margin:16px auto;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
.counter b{color:var(--gold);font-size:56px}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}.bar i{display:block;height:8px;background:var(--gold)}
input,textarea{width:100%;border:1px solid #C4D1C7;background:#fff;border-radius:9px;padding:11px;color:var(--ink);font:inherit;min-height:46px;margin-top:4px}
a{color:#1A7458}.dark a{color:var(--gold)}
.ad{background:#24463B;padding:13px;border-radius:9px;text-align:center;font-size:12px;border:1px dashed #5E806E}
.compass{width:230px;height:230px;border:2px solid var(--gold);border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;position:relative;margin:10px auto}
.compass span{position:absolute;color:var(--gold)}.compass span.s{bottom:8px;color:var(--mint)}
#arrow{transition:transform .15s}
.juz{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.juz button{height:42px;border-radius:9px;background:var(--card2);color:var(--cream);font-weight:700}.juz button.on{background:var(--gold);color:var(--bg)}
.sure{border-bottom:.5px solid #C4D1C7;padding:8px 0}.sure>button{background:none;color:inherit;text-align:left;width:100%;padding:0}
.ayah{direction:rtl;text-align:right;color:var(--card);line-height:2}
.plist button{display:block;width:100%;text-align:left;background:var(--card2);color:var(--cream);padding:11px;border-radius:9px;margin-top:5px;font-size:15px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rboxes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;width:100%}.rbox{background:var(--card2);border-radius:18px;padding:12px 4px;text-align:center;font-size:13px}.rbox b{display:block;color:var(--gold);font-size:30px;line-height:1.2}
.wbtn{background:var(--cream);color:var(--ink);border-radius:999px;padding:15px;font-weight:700;width:100%;font-size:16px}
.gcard{background:var(--cream);color:var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.chip{background:#E5EBE2;color:var(--ink);border-radius:14px;padding:10px 4px;text-align:center;font-size:14px;line-height:1.35}.chip.on{background:var(--card);color:var(--cream)}
.seg{display:flex;gap:6px}.seg button{padding:10px 18px;border-radius:999px;background:transparent;color:#7c8c83;font-weight:600;font-size:16px}.seg button.on{background:#ECEEEA;color:var(--ink)}
.gstep{background:#E8EEE7;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}.gstep h3{font-size:24px;margin:0}
.oku{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}.oku>button{background:none;color:var(--card);font-weight:700;font-size:17px;text-align:left;width:100%;padding:0;display:flex;justify-content:space-between}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gbtns .btn{margin:0;border-radius:999px}
.rf{background:#E0E8E0;color:var(--card);border-radius:12px;width:42px;height:42px;font-size:18px;flex:none}.dark .rf{background:var(--card2);color:var(--gold)}
.gcard .btn.out{color:var(--card);border-color:var(--card)}
.opt{display:flex;align-items:center;gap:12px;background:none;color:var(--cream);padding:9px 0;width:100%;text-align:left;font-size:17px}
.ck,.rd{width:28px;height:28px;border-radius:50%;border:2px solid #5E806E;flex:none;display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:800;position:relative}
.ck.on{background:var(--gold);border-color:var(--gold)}.rd.on{border-color:var(--gold)}.rd.on::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr}.sl{color:var(--mint);font-size:15px;margin-top:8px}
select{width:100%;background:var(--card2);color:var(--cream);border:1px solid var(--gold);border-radius:999px;padding:13px 16px;font:inherit;font-size:16px}
.kb{text-align:center;padding:12px;border-radius:12px;background:var(--card2);color:var(--mint);font-weight:600}.kb.ok{background:#1f6b45;color:#fff}
.hint{text-align:center;color:var(--mint);font-size:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #355C4D;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs div{max-width:560px;margin:auto;display:flex;justify-content:space-around;padding:8px 0}
#tabs button{background:none;color:var(--mint);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 8px}#tabs button i{font-style:normal;font-size:21px}
#tabs button.on{color:var(--gold)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:528px;margin:auto;background:var(--gold);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;display:none;z-index:9}
</style></head><body>
<div id="app"></div>
<nav id="tabs"><div></div></nav><div id="toast"></div>
<script>
const D={"countries":{"Türkiye":["İstanbul","Ankara","İzmir","Bursa","Konya","Antalya","Kahramanmaraş","Malatya","Trabzon","Gaziantep"],"Almanya":["Berlin","Hamburg","Münih","Köln"],"Fransa":["Paris","Lyon"],"Hollanda":["Amsterdam","Rotterdam"],"Belçika":["Brüksel","Anvers"],"Birleşik Krallık":["Londra","Manchester"],"ABD":["New York","Chicago"],"Suudi Arabistan":["Mekke","Medine"]},"zikirs":[{"name":"Sübhanallah","arabic":"سُبْحَانَ اللّٰهِ","meaning":"Allah’ı eksikliklerden uzak tutarım."},{"name":"Elhamdülillah","arabic":"الْحَمْدُ لِلّٰهِ","meaning":"Hamd Allah’a mahsustur."},{"name":"Allahu Ekber","arabic":"اللّٰهُ أَكْبَرُ","meaning":"Allah en büyüktür."},{"name":"Estağfirullah","arabic":"أَسْتَغْفِرُ اللّٰهَ","meaning":"Allah’tan bağışlanma dilerim."},{"name":"Lâ ilâhe illallah","arabic":"لَا إِلٰهَ إِلَّا اللّٰهُ","meaning":"Allah’tan başka ilah yoktur."},{"name":"Salavat","arabic":"اللّٰهُمَّ صَلِّ عَلَى مُحَمَّدٍ","meaning":"Allah’ım, Muhammed’e salât eyle."}],"duas":[{"name":"Hz. Yunus’un Duası","cat":"Peygamber","ar":"لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","pron":"Lâ ilâhe illâ ente sübhâneke innî küntü mine’z-zâlimîn.","meaning":"Senden başka ilah yoktur. Seni eksikliklerden uzak tutarım. Ben kendine zulmedenlerden oldum. (Enbiyâ 21:87)"},{"name":"Hz. Musa’nın Duası","cat":"Peygamber","ar":"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","pron":"Rabbi’şrah lî sadrî ve yessir lî emrî.","meaning":"Rabbim, gönlüme ferahlık ver ve işimi kolaylaştır. (Tâhâ 20:25-26)"},{"name":"İstiğfar","cat":"Tövbe","ar":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","pron":"Estağfirullâhe ve etûbü ileyh.","meaning":"Allah’tan bağışlanma diler ve O’na tövbe ederim."},{"name":"Yemek Öncesi","cat":"Günlük","ar":"بِسْمِ اللَّهِ","pron":"Bismillâh.","meaning":"Allah’ın adıyla."},{"name":"Rükû Tesbihi","cat":"Namaz","ar":"سُبْحَانَ رَبِّيَ الْعَظِيمِ","pron":"Sübhâne rabbiye’l-azîm.","meaning":"Yüce Rabbimi eksikliklerden uzak tutarım."},{"name":"Secde Tesbihi","cat":"Namaz","ar":"سُبْحَانَ رَبِّيَ الْأَعْلَى","pron":"Sübhâne rabbiye’l-a’lâ.","meaning":"En yüce Rabbimi eksikliklerden uzak tutarım."}],"lessons":[{"name":"Abdest Nasıl Alınır?","category":"İbadet","intro":"Abdest, belirli organların yıkanması ve mesh edilmesiyle yapılan ibadet temizliğidir.","steps":[{"title":"Farzlar","body":"Hanefî mezhebine göre yüzü yıkamak, kolları dirseklerle birlikte yıkamak, başın en az dörtte birini mesh etmek, ayakları topuklarla birlikte yıkamak abdestin farzlarıdır.","note":"Mezheplere göre bazı ayrıntılar farklı olabilir."},{"title":"Eller, ağız ve burun","body":"Niyet ve besmeleden sonra eller yıkanır; ağıza ve buruna üçer defa su verilir.","note":"Niyet Hanefî mezhebinde sünnettir."},{"title":"Yüz ve kollar","body":"Yüzün tamamı yıkanır. Önce sağ sonra sol kol dirseklerle birlikte yıkanır.","note":"Yıkanması gereken yerlerde kuru alan bırakılmaz."},{"title":"Mesh ve ayaklar","body":"Baş mesh edilir, kulaklar mesh edilir. Ayaklar topuklarla birlikte yıkanır.","note":"Parmak aralarına su ulaşmalıdır."}]},{"name":"Gusül Abdesti","category":"İbadet","intro":"Gusül bütün bedenin dinen gerekli şekilde yıkanmasıdır.","steps":[{"title":"Guslün farzları","body":"Hanefî mezhebine göre ağza su vermek, buruna su vermek ve bütün bedeni yıkamak farzdır.","note":"Kuru yer kalmamasına dikkat edilir."},{"title":"Hazırlık","body":"Niyet edilir, besmele çekilir, eller ve kirli bölgeler temizlenir.","note":"Niyet ve besmele sünnetlerdendir."},{"title":"Bütün beden","body":"Ağıza ve buruna su verildikten sonra baş ve bütün vücut yıkanır.","note":"Suyun deriyle temasını engelleyen maddeler giderilmelidir."}]},{"name":"Teyemmüm","category":"İbadet","intro":"Su bulunmadığında veya geçerli mazeretle kullanılamadığında yapılan temizlik.","steps":[{"title":"Şartlar","body":"Suyun bulunmaması veya kullanımının mümkün olmaması gibi geçerli mazeretler değerlendirilir.","note":"Su varken sırf kolaylık için yapılmaz."},{"title":"Niyet ve yüz","body":"Niyet edilir. Eller uygun temiz yüzeye vurularak yüz mesh edilir.","note":"Niyet gereklidir."},{"title":"Kollar","body":"Eller tekrar yüzeye vurularak kollar dirseklerle birlikte mesh edilir.","note":"Hanefî uygulaması esas alınmıştır."}]},{"name":"Oruç ve Ramazan","category":"İbadet","intro":"Oruç, imsak ile gün batımı arasında belirli davranışlardan ibadet niyetiyle uzak durmaktır.","steps":[{"title":"Niyet","body":"Oruç için niyet edilir; sahur yapmak sünnettir.","note":"Niyetin zamanı oruç türüne göre değişebilir."},{"title":"Orucu korumak","body":"Yeme, içme ve orucu bozan davranışlardan uzak durulur.","note":"Tıbbi durumlar için güvenilir fetvaya başvurulur."},{"title":"İftar","body":"Güneş battıktan sonra oruç açılır; dua ve paylaşma önemlidir.","note":"İhtiyaç sahipleri gözetilir."}]},{"name":"Sabah Namazı","category":"Namaz","intro":"İki rekât sünnet ve iki rekât farz.","steps":[{"title":"Hazırlık","body":"Abdest, vakit, kıble, örtünme ve niyet kontrol edilir.","note":"Namazın şartları yerine getirilir."},{"title":"Sünnet","body":"İki rekât sünnet kılınır, son oturuş ve selamla tamamlanır.","note":"Sünnet için ayrı niyet edilir."},{"title":"Farz","body":"İki rekât farz tek başına veya cemaatle kılınır.","note":"İmama uyma hükümleri mezhebe göre değişebilir."}]},{"name":"Öğle Namazı","category":"Namaz","intro":"Dört ilk sünnet, dört farz, iki son sünnet.","steps":[{"title":"İlk sünnet","body":"Dört rekât ilk sünnete niyet edilir.","note":"Oturuş sırası öğrenilir."},{"title":"Farz","body":"Dört rekât farza niyet edilir.","note":"Cemaatle kılınırken imam takip edilir."},{"title":"Son sünnet","body":"İki rekât son sünnet kılınır.","note":"Her bölüm için niyet ayrıdır."}]},{"name":"İkindi Namazı","category":"Namaz","intro":"Dört sünnet ve dört farz.","steps":[{"title":"Sünnet","body":"Dört rekât gayrimüekked sünnet kılınabilir.","note":"İlk oturuştaki uygulama farklarını öğren."},{"title":"Farz","body":"Dört rekât farz kılınır.","note":"Kıraat ve oturuş sırası önemlidir."}]},{"name":"Akşam Namazı","category":"Namaz","intro":"Üç farz ve iki sünnet.","steps":[{"title":"Farz","body":"Üç rekât farz kılınır; ikinci rekâttan sonra ilk oturuş vardır.","note":"Üçüncü rekâtın kıraati farklıdır."},{"title":"Sünnet","body":"İki rekât sünnet kılınır.","note":"Son oturuş ve selamla tamamlanır."}]},{"name":"Yatsı ve Vitir","category":"Namaz","intro":"Dört ilk sünnet, dört farz, iki son sünnet ve üç vitir.","steps":[{"title":"Yatsı","body":"Sünnet ve farz bölümleri sırasıyla kılınır.","note":"Her bölümün niyeti ayrıdır."},{"title":"Vitir","body":"Hanefî mezhebine göre vitir üç rekât ve vaciptir.","note":"Diğer mezheplerde farklı uygulamalar bulunur."},{"title":"Kunut","body":"Üçüncü rekâtta kıraatten sonra tekbir alınarak kunut duaları okunur.","note":"Kunut duaları ayrıca öğrenilir."}]},{"name":"Cenaze Namazı","category":"Namaz","intro":"Rükû ve secdesi bulunmayan, ayakta kılınan namaz.","steps":[{"title":"İlk tekbir","body":"Niyet edilir, tekbirden sonra Sübhâneke okunur.","note":"Farz-ı kifâyedir."},{"title":"İkinci tekbir","body":"Salavatlar okunur.","note":"Rükû ve secde yapılmaz."},{"title":"Üçüncü tekbir","body":"Cenaze için dua edilir.","note":"Duanın tam metni ayrıca doğrulanmalıdır."},{"title":"Dördüncü tekbir","body":"Tekbirden sonra selam verilir.","note":"Hanefî uygulamasının özetidir."}]},{"name":"Bayram Namazı","category":"Namaz","intro":"Cemaatle kılınan iki rekâtlık namaz.","steps":[{"title":"İlk rekât","body":"Hanefî uygulamasında üç ilave tekbir alınır.","note":"İmam takip edilir."},{"title":"İkinci rekât","body":"Kıraatten sonra üç ilave tekbir alınır.","note":"Namazdan sonra hutbe dinlenir."}]},{"name":"Namaz Duaları","category":"Dualar","intro":"Namazda okunan temel dualar.","steps":[{"title":"Sübhâneke","body":"Başlangıç duasının anlamı ve okunuşu öğrenilir.","note":"Arapça metin ayrı doğrulanmış içerik olarak eklenecek."},{"title":"Ettehiyyâtü","body":"Oturuş duasının yeri öğrenilir.","note":"İlk ve son oturuş ayrımına dikkat edilir."},{"title":"Salavat ve Rabbenâ","body":"Salli, Bârik ve Rabbenâ duaları öğrenilir.","note":"Vitirde kunut duaları ayrıca çalışılır."}]},{"name":"Kısa Sureler","category":"Dualar","intro":"Namazda sık okunan sureleri tanı.","steps":[{"title":"Fâtiha","body":"Fâtiha suresinin anlamı ve namazdaki yeri.","note":"Tam ayet metinleri doğrulanmış veri kaynağıyla eklenecek."},{"title":"İhlâs","body":"Allah’ın birliğini anlatır.","note":"Tevhid konusu."},{"title":"Felak ve Nâs","body":"Allah’a sığınmayı konu edinir.","note":"Surelerin tam metni kaynak kontrolüyle eklenecek."}]},{"name":"Tövbe ve İstiğfar","category":"Maneviyat","intro":"Hatalardan dönme ve bağışlanma dileme.","steps":[{"title":"Pişmanlık","body":"Yanlış davranış için içtenlikle pişmanlık duyulur.","note":"Samimiyet önemlidir."},{"title":"Terk ve kararlılık","body":"Yanlış bırakılır ve tekrarlanmaması için karar verilir.","note":"Davranış değişikliği gerekir."},{"title":"Kul hakkı","body":"Başkasının hakkı ihlal edilmişse iade veya helalleşme gözetilir.","note":"Kul hakkı özel sorumluluktur."}]},{"name":"Peygamberimizin Hayatı","category":"Siyer","intro":"Hz. Muhammed’in hayatından temel dönemler.","steps":[{"title":"Çocukluk","body":"Mekke’de doğumu, ailesi ve gençlik dönemi.","note":"Siyer kronolojisi takip edilir."},{"title":"İlk vahiy","body":"Hira’da ilk vahiy ve tebliğin başlangıcı.","note":"Mekke dönemi yaklaşık 13 yıldır."},{"title":"Hicret","body":"Medine’ye hicret ve toplumun kuruluşu.","note":"İslam tarihinde dönüm noktasıdır."},{"title":"Veda Hutbesi","body":"Adalet, sorumluluk ve insan hakları vurguları.","note":"Kaynaklar üzerinden ayrıntılı incelenmelidir."}]},{"name":"İmanın Şartları","category":"İnanç","intro":"İslam inancının temel esasları.","steps":[{"title":"Allah’a iman","body":"Allah’ın birliği ve sıfatları.","note":"Tevhid esastır."},{"title":"Meleklere ve kitaplara iman","body":"Meleklerin ve ilahi kitapların dinî yeri.","note":"Gayba iman açıklanır."},{"title":"Peygamberler","body":"Peygamberlerin rehberliği.","note":"Örnek ahlak önemlidir."},{"title":"Ahiret ve kader","body":"Sorumluluk, ahiret ve kader kavramları.","note":"Güvenilir kaynaklarla ayrıntılandırılır."}]}],"sources":{"vakit":"https://namazvakitleri.diyanet.gov.tr/","kuran":"https://kuran.diyanet.gov.tr/","namaz":"https://namaz.diyanet.gov.tr/"}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ascii=s=>s.replace(/İ/g,'I').replace(/ı/g,'i').replace(/ç/g,'c').replace(/Ç/g,'C').replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ü/g,'u').replace(/Ü/g,'U').replace(/ö/g,'o').replace(/Ö/g,'O');

async function openSurah(n){if(U.openS===n){U.openS=0;return R()}U.openS=n;S.lastSurah=n;save();if(!Q.cache[n]){Q.loading=true;R();try{const j=await (await fetch(`https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,tr.diyanet`)).json();if(!j.data||j.data.length<2)throw 0;Q.cache[n]={ar:j.data[0].ayahs,tr:j.data[1].ayahs}}catch(e){Q.cache[n]={error:1}}Q.loading=false}R()}
function loadSurahs(){if(Q.status!=='idle'&&Q.status!=='error')return;Q.status='loading';fetch('https://api.alquran.cloud/v1/surah').then(r=>r.json()).then(j=>{if(!j.data)throw 0;Q.surahs=j.data;Q.status='ok';if(U.tab==='Kur’an')R()}).catch(()=>{Q.status='error';if(U.tab==='Kur’an')R()})}

/* ---- Öğren ---- */
function vOgr(){let h=Pn(`<div class="gold">Dinimi Öğreniyorum</div><span class="sm">Açıklamalı dersler · Kaydet · Tamamla</span><div class="opts">${['İbadet','Namaz','Dualar','Maneviyat','Siyer','İnanç','Kaydedilenler'].map(c=>P(c,U.lcat===c,'lc')).join('')}</div>`,1);
h+=D.lessons.filter(l=>U.lcat==='Kaydedilenler'?has('savedLessons',l.name):l.category===U.lcat).map(l=>{const o=U.lesson===l.name,s=l.steps[U.step]||l.steps[0];return Pn(`<h3><button class="toggle" style="border:0;padding:0;font-weight:700;font-size:19px" data-a="lopen" data-v="${esc(l.name)}">${esc(l.name)} <span>${o?'⌃':'⌄'}</span></button></h3><span class="sm">${l.steps.length} açıklamalı bölüm ${has('completed',l.name)?'· Tamamlandı':''}</span>`+(o?`<p>${esc(l.intro)}</p><div class="inner"><span class="sm">Bölüm ${U.step+1}/${l.steps.length}</span><b style="font-size:19px">${esc(s.title)}</b><p>${esc(s.body)}</p><p class="sm" style="color:#38604B">✦ ${esc(s.note)}</p></div><div class="row">${B('← Önceki','lstep',-1,1)}${B('Sonraki →','lstep',1,1)}</div>`+B(has('savedLessons',l.name)?'Kaydı Kaldır':'Dersi Kaydet','lsave',l.name)+B(has('completed',l.name)?'Tamamlandı ✓':'Dersi Tamamladım','ldone',l.name,1):''))}).join('');
return h+Pn(`<p class="sm">Dinî anlatımlar Hanefî örnekleriyle hazırlanmış çalışma içeriğidir. Yayımdan önce Diyanet kaynaklarıyla editoryal kontrol gerektirir.</p>${L('Diyanet Namaz Portalı',D.sources.namaz)}`)}

/* ---- Bildirim altyapısı ---- */
const HADIS=[[`Ameller ancak niyetlere göredir.`,`Buhârî, Müslim`],[`Kolaylaştırın, zorlaştırmayın; müjdeleyin, nefret ettirmeyin.`,`Buhârî, Müslim`],[`Sizin en hayırlınız, Kur’an’ı öğrenen ve öğretendir.`,`Buhârî`],[`Temizlik imanın yarısıdır.`,`Müslim`],[`Güzel söz sadakadır.`,`Buhârî, Müslim`],[`Müslüman, diğer Müslümanların elinden ve dilinden emin olduğu kimsedir.`,`Buhârî, Müslim`],[`Hiçbiriniz, kendisi için istediğini din kardeşi için de istemedikçe iman etmiş olmaz.`,`Buhârî, Müslim`]];
const doy=()=>Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
function dailyContent(k){const d=doy();if(k==='ayet'){const a=AYET[d%AYET.length];return ['Günün Ayeti',a[1]+' ('+a[2]+')']}if(k==='hadis'){const h=HADIS[d%HADIS.length];return ['Günün Hadisi',h[0]+' ('+h[1]+')']}if(k==='esma'){const e=ESMA[d%ESMA.length];return ['Esmaül Hüsna',e[1]+' — '+e[2]]}const u=D.duas[d%D.duas.length];return ['Günün Duası',u.name+': '+u.meaning]}
let AC;function tone(f,t0,d,g){const c=AC,o=c.createOscillator(),v=c.createGain(),s=c.currentTime+t0;o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(0.0001,s);v.gain.linearRampToValueAtTime(g||0.2,s+0.02);v.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(v);v.connect(c.destination);o.start(s);o.stop(s+d+0.05)}
function playSound(k){if(k==='sessiz')return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(k==='klasik'){tone(880,0,.35);tone(660,.3,.55)}else{[523,659,784,1047].forEach((f,i)=>tone(f,i*.16,.32))}}catch(e){}}
const VIB={kisa:[200],cift:[150,100,150],uzun:[700]};
const buzz=k=>{if(k&&VIB[k]&&navigator.vibrate)navigator.vibrate(VIB[k])};
function fire(title,body){toast(title+' — '+body);playSound(S.np.sound);buzz(S.np.vib);if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}}
const FIRED={};
function tick2(){const d=new Date(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),day=d.toDateString();
if(S.setup&&S.np.on&&T.t&&!T.demo)PR5.forEach(([a,b])=>{if(!S.np.list[a])return;const m=/(\d+):(\d+)/.exec(T.t[b]||'');if(!m)return;const tg=(+m[1])*3600+(+m[2])*60-S.np.before*60,k=day+a+S.np.before,hm=m[1].padStart(2,'0')+':'+m[2];if(sec>=tg&&sec<tg+60&&!FIRED[k]){FIRED[k]=1;fire('MİHRA · '+a,S.np.before?`${a} namazına ${S.np.before} dakika kaldı (${hm})`:`${a} vakti girdi (${hm})`)}});
const p=S.dn.time.split(':'),tg=(+p[0])*3600+(+p[1])*60;if(S.setup&&sec>=tg&&sec<tg+60)['ayet','hadis','esma','dua'].forEach(k=>{const key=day+k;if(S.dn[k]&&!FIRED[key]){FIRED[key]=1;const c=dailyContent(k);fire(c[0],c[1])}})}
const chk=(l,on,a,v)=>`<button class="opt" data-a="${a}" data-v="${esc(v==null?'':v)}"><span class="ck${on?' on':''}">${on?'✓':''}</span><span>${esc(l)}</span></button>`;
const rad=(l,on,a,v)=>`<button class="opt" data-a="${a}" data-v="${v}"><span class="rd${on?' on':''}"></span><span>${l}</span></button>`;
const DN=[['ayet','Günün Ayeti'],['hadis','Günün Hadisi'],['esma','Esmaül Hüsna'],['dua','Günün Duası']];
/* ---- Kurulum, ayarlar, kabuk ---- */
const locHTML_old=()=>`<b>Ülke</b><div class="opts">${Object.keys(D.countries).map(c=>P(c,S.country===c,'country')).join('')}</div><b>Şehir</b><div class="opts">${D.countries[S.country].map(c=>P(c,S.city===c,'city')).join('')}</div>`;
const togHTML=()=>chk('Namaz bildirimleri',S.np.on,'np_on')+DN.map(([k,l])=>chk(l,S.dn[k],'dn_tog',k)).join('');
function notif(){if(!('Notification' in window)){toast('Bu tarayıcı bildirimleri desteklemiyor (iPhone Safari için uygulamayı Ana Ekrana ekle). Demo: bildirimler gerçek uygulamada çalışacak.');return}
Notification.requestPermission().then(p=>{if(p==='granted'){try{new Notification('MİHRA',{body:'Test bildirimi: Sıradaki namaz vaktinde haber verilecek.'})}catch(e){toast('Bildirim izni var; bu cihaz sayfa bildirimini göstermiyor.')}}else toast('Bildirim izni verilmedi.')})}
function vSet(){let b='';
if(U.stab==='Konum')b=`<div class="sl">Konumun</div><p>⌖ ${esc(S.city)}${S.country?', '+esc(S.country):''} <span class="sm mint">(${S.auto?'otomatik konum':'elle seçildi'})</span></p>${U.loc==='loading'?'<p>Konum alınıyor…</p>':U.loc==='fail'?`<p class="sm" style="color:var(--gold)">${locErr()}</p>`:''}${B('📍 Konumumu otomatik bul','autoloc')}${B(U.manual?'Elle seçmeyi kapat':'Şehri elle seç','manual',0,1)}${U.manual?pickHTML():''}`;
else if(U.stab==='Namaz Bildirimleri')b=chk('Namaz bildirimleri açık',S.np.on,'np_on')+`<div class="sl">Bildirilecek vakitler</div><div class="g2">${PR5.map(([a])=>chk(a,S.np.list[a],'np_pr',a)).join('')}</div><div class="sl">Bildirim sesi</div>`+[['melodi','Kısa melodi'],['klasik','Klasik bildirim'],['sessiz','Sessiz']].map(([k,l])=>rad(l,S.np.sound===k,'np_snd',k)).join('')+`<div class="sl">Titreşim</div>`+[['kapali','Kapalı'],['kisa','Kısa'],['cift','Çift'],['uzun','Uzun']].map(([k,l])=>rad(l,S.np.vib===k,'np_vib',k)).join('')+`<div class="sl">Hatırlatma</div><select id="before">${[0,1,5,10,15,20].map(m=>`<option value="${m}"${S.np.before===m?' selected':''}>${m?m+' dakika önce':'Tam vaktinde'}</option>`).join('')}</select>`+B('🔔 Bildirimi dene','ntest',0,1)+B('Bildirim iznini ver','notif',0,1)+`<p class="sm mint">Web sürümünde hatırlatmalar sayfa açıkken çalışır. Uygulama kapalıyken bildirim, gerçek iOS/Android uygulamasında olacak.</p>`;
else b=DN.map(([k,l])=>chk(l,S.dn[k],'dn_tog',k)).join('')+`<div class="sl">Gönderim saati</div><select id="dtime">${['07:00','09:00','12:00','18:00','21:00'].map(h=>`<option${S.dn.time===h?' selected':''}>${h}</option>`).join('')}</select>`+B('🔔 Örnek bildirim gönder','dtest',0,1)+B('Bildirim iznini ver','notif',0,1)+`<p class="sm mint">Hadis ve ayet metinleri kısa anlam olarak verilir; yayın öncesi kaynaklarıyla doğrulanmalıdır.</p>`;
return Pn(`<h3 style="margin:0">Ayarlar</h3><div class="opts">${['Konum','Namaz Bildirimleri','Günlük Bildirimler'].map(x=>P(x,U.stab===x,'stab')).join('')}</div>`+b+B('Ayarları Kapat','settings'),1)}
const views={'Vakitler':vVak,'Kıble':vKib,'Zikir':vZik,'Kur’an':vKur,'Öğren':vOgr};
function R(){const y=scrollY;let h;
if(U.stage===0)h=`<div class="welcome"><div class="logo">☾</div><div class="brandbig">MİHRA</div><b style="font-size:18px">Huzura açılan bir kapı.</b><p class="mint" style="margin-top:10px">Namaz vakitleri, kıble, zikir, Kur’an ve dinî bilgiler bir arada.</p><div style="height:24px"></div>${B('Başlayalım →','stage',1)}<span class="mint sm">Ücretsiz · Üyelik gerektirmez</span></div>`;
else if(U.stage===1)h=Pn(`<div class="gold">İLK KURULUM · 1/2</div><h3 style="font-size:24px">Konumun</h3>`+(U.loc==='loading'?`<p>Konumun alınıyor… Tarayıcı izin isterse <b>İzin ver</b>'e dokun.</p>`:`<p class="mint sm">Namaz vakitleri ve kıble otomatik ayarlansın diye konum izni gerekir. İzin vermezsen şehrini aşağıdan arayarak seçebilirsin.</p>`+(U.loc==='fail'?`<p class="sm" style="color:var(--gold)">${locErr()}</p>`:'')+B('📍 Konumumu otomatik bul','autoloc')+pickHTML()),1);
else if(U.stage===2)h=Pn(`<div class="gold">İLK KURULUM · 2/2</div><h3 style="font-size:24px">Bildirim tercihleri</h3>${togHTML()}${B('Bildirim iznini dene','notif',0,1)}<p class="mint sm">Tercihler kaydedilir. Gerçek bildirimler web’de sınırlıdır; telefon uygulamasında çalışacak.</p>${B('MİHRA\'yı Aç →','finish')}`,1);
else h=`<div class="header"><div><div class="brand">MİHRA</div><span class="mint sm">⌖ ${esc(S.city)}${S.country?', '+esc(S.country):''}${T.demo?' · Önizleme':''}</span></div><button class="icon" data-a="settings" aria-label="Ayarlar" style="font-size:20px;width:52px;height:52px;border-radius:50%">${U.settings?'✕':'⚙'}</button></div>`+(U.settings?vSet():views[U.tab]());
$('#app').innerHTML=h;const t=$('#tabs');t.style.display=U.stage===3?'block':'none';
t.firstElementChild.innerHTML=[['Vakitler','🕒'],['Kıble','🧭'],['Zikir','📿'],['Kur’an','📖'],['Öğren','🎓']].map(([n,i])=>`<button class="${U.tab===n?'on':''}" data-a="tab" data-v="${n}"><i>${i}</i>${n}</button>`).join('');scrollTo(0,y)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;const go=top=>{R();if(top)scrollTo(0,0)};
const Z=()=>S.zikir,cnt=()=>S.counts[Z()]||0;
switch(a){
case 'stage':U.stage=+v;if(U.stage===1){locate();return}return go(1);
case 'finish':S.setup=true;save();U.stage=3;loadTimes();if(!iosPerm)compass();return go(1);
case 'settings':U.settings=!U.settings;return go(1);
case 'tab':U.tab=v;U.settings=false;if(v==='Kıble'&&iosPerm&&!K.on&&K.st!=='denied')compass();if(v==='Kur’an')loadSurahs();return go(1);
case 'stab':U.stab=v;return go();
case 'np_on':S.np.on=!S.np.on;save();return go();
case 'np_pr':S.np.list[v]=!S.np.list[v];save();return go();
case 'np_snd':S.np.sound=v;save();playSound(v);return go();
case 'np_vib':S.np.vib=v;save();buzz(v);return go();
case 'dn_tog':S.dn[v]=!S.dn[v];save();return go();
case 'ntest':fire('MİHRA · Test','Bildirim ayarların çalışıyor.');return;
case 'dtest':{const k=DN.map(x=>x[0]).find(x=>S.dn[x])||'ayet',c=dailyContent(k);fire(c[0],c[1]);return}
case 'autoloc':locate();return;
case 'manual':U.manual=!U.manual;return go();
case 'pcountry':{const r=REG.find(x=>x[0]===v);U.pc={cc:v,name:r?r[1]:v};U.cityRes=[];U.cityMsg='';R();const c=$('#cts');if(c)c.focus();return}
case 'pcity':{const r=U.cityRes[+v];if(!r)return;Object.assign(S,{country:U.pc.name,cc:U.pc.cc,city:r.name,lat:r.latitude,lon:r.longitude,auto:false});save();U.manual=false;U.cityRes=[];U.pc=null;U.loc='idle';if(U.stage===1)U.stage=2;toast('Konum ayarlandı: '+S.city+', '+S.country);loadTimes();return go(1)}
case 'tog':if(v==='notifications')S.notifications=!S.notifications;else S.daily[v]=!S.daily[v];save();return go();
case 'notif':return notif();
case 'reload':loadTimes();return go();
case 'guide':U.guide=!U.guide;return go();
case 'gpart':U.gpart=+v;U.gstep=0;U.gopen=false;return go();
case 'gmode':U.gmode=v;U.gstep=0;U.gopen=false;return go();
case 'goku':U.gopen=!U.gopen;return go();
case 'gprev':U.gstep=Math.max(0,U.gstep-1);U.gopen=false;return go();
case 'gnext':{const n=nextP();const pt=n&&RK[n.name][U.gpart];if(!pt)return;const N=genSteps(pt[2],pt[1],U.gmode).length;if(U.gstep>=N-1){U.guide=false;U.gstep=0;toast('Bu namazın adımlarını tamamladın. Allah kabul etsin.');return go()}U.gstep++;U.gopen=false;return go()}
case 'vrow':U.vopen=U.vopen===v?'':v;return go();
case 'rfa':U.ayi=((U.ayi<0?Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5)%AYET.length:U.ayi)+1)%AYET.length;return go();
case 'rfe':U.esi=((U.esi<0?Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5)%ESMA.length:U.esi)+1)%ESMA.length;return go();
case 'compass':K.on=false;K.st='idle';compass().then(()=>{if(U.tab==='Kıble')R()});return;
case 'simL':K.heading=((K.heading||0)+345)%360;checkAlign();return go();
case 'simR':K.heading=((K.heading||0)+15)%360;checkAlign();return go();
case 'zs':U.zs=v;return go();
case 'zk':S.zikir=v;save();return go();
case 'tap':{const n=cnt()+1;S.counts[Z()]=n;save();if(navigator.vibrate)navigator.vibrate(n===S.goal?[0,200,100,200]:15);$('#cnt').textContent=n;$('#bar').style.width=Math.min(100,n/S.goal*100)+'%';$('#goalt').textContent=`Hedef: ${S.goal} · %${Math.min(100,Math.round(n/S.goal*100))}`;return}
case 'undo':S.counts[Z()]=Math.max(0,cnt()-1);save();return go();
case 'reset':if(confirm('Bu zikrin sayacı sıfırlansın mı?')){S.counts[Z()]=0;save();go()}return;
case 'goal':S.goal=+v;save();return go();
case 'favz':tog('favZ',v);return go();
case 'favd':tog('favD',v);return go();
case 'imp':S.zikir=v;save();U.zs='Zikirmatik';return go(1);
case 'dc':U.duaCat=v;return go();
case 'duaopen':U.duaOpen=U.duaOpen===v?'':v;return go();
case 'gotodua':U.duaCat='Kaydedilenler';U.zs='Hazır Dualar';U.duaOpen=v;return go(1);
case 'savedua':{const d=U.draft;if(!d.name.trim()||!d.meaning.trim()){toast('Başlık ve dua metni gerekli.');return}if(U.edit<0)S.custom.push(Object.assign({},d));else S.custom[U.edit]=Object.assign({},d);save();U.draft=blank();U.edit=-1;toast('Dua kaydedildi.');return go()}
case 'editdua':U.draft=Object.assign({},S.custom[+v]);U.edit=+v;return go();
case 'deldua':if(confirm('Bu dua silinsin mi?')){S.custom.splice(+v,1);save();go()}return;
case 'qv':U.qv=v;return go();
case 'fsm':U.fs=Math.max(16,U.fs-2);return go();
case 'fsp':U.fs=Math.min(40,U.fs+2);return go();
case 'surah':return openSurah(+v);
case 'bm':tog('bookmarks',S.page);return go();
case 'juz':S.page=starts[+v-1];save();return go();
case 'pg':{const n=S.page+ +v;if(n>=1&&n<=604){S.page=n;save();go()}return}
case 'gopg':S.page=+v;save();return go();
case 'lc':U.lcat=v;U.lesson='';return go();
case 'lopen':U.lesson=U.lesson===v?'':v;U.step=0;return go();
case 'lstep':{const l=D.lessons.find(x=>x.name===U.lesson);U.step=Math.max(0,Math.min(l.steps.length-1,U.step+ +v));return go()}
case 'lsave':tog('savedLessons',v);return go();
case 'ldone':tog('completed',v);return go();
}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f){U.draft[t.dataset.f]=t.value}else if(t.id==='before'){S.np.before=+t.value;save()}else if(t.id==='dtime'){S.dn.time=t.value;save()}else if(t.id==='cs'){U.pc=null;U.cityRes=[];U.cityMsg='';$('#cl').innerHTML=countryList(t.value);const c=$('#cts');if(c){c.disabled=true;c.value='';$('#ctl').innerHTML=''}}else if(t.id==='cts'){citySearch(t.value)}else if(t.id==='sq'){U.query=t.value;$('#sl').innerHTML=sureList()}});
setInterval(()=>{try{tick2()}catch(e){}const n=nextP(),c=$('#cd');if(n&&c){c.textContent=n.left;$('#cdn').textContent=n.time+' · Namaza kalan süre'}},1000);
R();if(U.stage===3){loadTimes();silentLoc();if(!iosPerm)compass()}
</script></body></html>
